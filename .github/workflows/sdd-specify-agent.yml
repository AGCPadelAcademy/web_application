name: SDD Specification Agent

on:
  issues:
    types: [opened, labeled]

jobs:
  trigger-specification-agent:
    # New F1.xx issues are automatic. Existing issues can be queued by
    # applying the `sdd:specify` label.
    if: >-
      github.event.issue.pull_request == null &&
      (
        github.event.action == 'opened' ||
        (github.event.action == 'labeled' && github.event.label.name == 'sdd:specify')
      ) &&
      startsWith(github.event.issue.title, 'F1.')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read

    steps:
      - name: Trigger Cursor SDD Specification Automation
        env:
          CURSOR_WEBHOOK_URL: ${{ secrets.CURSOR_AUTOMATION_WEBHOOK_URL }}
          CURSOR_WEBHOOK_AUTH: ${{ secrets.CURSOR_AUTOMATION_AUTH }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          REPOSITORY: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          if [ -z "${CURSOR_WEBHOOK_URL}" ] || [ -z "${CURSOR_WEBHOOK_AUTH}" ]; then
            echo "Cursor webhook secrets are not configured."
            exit 1
          fi

          payload=$(python - <<'PY'
          import json, os

          print(json.dumps({
              "event": "github.issue.sdd_specify",
              "action": os.environ["ACTION"],
              "repository": os.environ["REPOSITORY"],
              "issue_number": int(os.environ["ISSUE_NUMBER"]),
              "issue_title": os.environ["ISSUE_TITLE"],
              "issue_url": os.environ["ISSUE_URL"],
          }))
          PY
          )

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${CURSOR_WEBHOOK_URL}" \
            --header "Authorization: ${CURSOR_WEBHOOK_AUTH}" \
            --header "Content-Type: application/json" \
            --data "${payload}"
