name: SDD Tasks Agent

on:
  issues:
    types: [labeled]

jobs:
  trigger-tasks-agent:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.label.name == 'sdd:tasks' &&
      startsWith(github.event.issue.title, 'F1.')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read

    steps:
      - name: Trigger Cursor SDD Tasks Automation
        env:
          CURSOR_WEBHOOK_URL: ${{ secrets.CURSOR_TASK_AUTOMATION_WEBHOOK_URL }}
          CURSOR_WEBHOOK_AUTH: ${{ secrets.CURSOR_TASK_AUTOMATION_AUTH }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          REPOSITORY: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          if [ -z "${CURSOR_WEBHOOK_URL}" ] || [ -z "${CURSOR_WEBHOOK_AUTH}" ]; then
            echo "Cursor Tasks webhook secrets are not configured."
            exit 1
          fi

          payload=$(python - <<'PY'
          import json
          import os
          import re

          issue_title = os.environ["ISSUE_TITLE"]
          feature_id = issue_title.split(" - ", 1)[0].strip()
          feature_slug = re.sub(r"[^a-z0-9]+", "-", issue_title.lower()).strip("-")
          source_branch = f"sdd/{feature_slug}"
          run_id = f"sdd-tasks-{feature_id.lower().replace('.', '-')}-issue-{os.environ['ISSUE_NUMBER']}"

          print(json.dumps({
              "event": "github.issue.sdd_tasks",
              "stage": "tasks",
              "action": os.environ["ACTION"],
              "run_id": run_id,
              "feature_id": feature_id,
              "repository": os.environ["REPOSITORY"],
              "issue_number": int(os.environ["ISSUE_NUMBER"]),
              "issue_title": issue_title,
              "issue_url": os.environ["ISSUE_URL"],
              "branch": source_branch,
              "source_branch": source_branch,
              "source_plan_path": f"specs/features/{feature_slug}/plan.md",
          }))
          PY
          )

          echo "Dispatching SDD Tasks run: ${payload}"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${CURSOR_WEBHOOK_URL}" \
            --header "Authorization: ${CURSOR_WEBHOOK_AUTH}" \
            --header "Content-Type: application/json" \
            --data "${payload}"
